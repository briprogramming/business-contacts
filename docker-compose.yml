services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - ./server:/app

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - 127.0.0.1:1234:1234
    volumes:
      - ./client:/app
    depends_on:
      - server